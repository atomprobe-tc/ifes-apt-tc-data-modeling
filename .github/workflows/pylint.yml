name: linting

on: [push]

env:
  PYTHON_VERSION: "3.12"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install package and dev dependencies
        run: uv pip install ".[dev]"

      - name: Run ruff check
        run: ruff check src/ifes_apt_tc_data_modeling tests

      - name: Run ruff format
        run: ruff format --check src/ifes_apt_tc_data_modeling tests

      - name: Run mypy
        run: mypy src/ifes_apt_tc_data_modeling tests